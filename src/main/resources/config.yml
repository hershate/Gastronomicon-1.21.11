options:
  # 是否启用自动更新（1.1.5 已移除更新检查功能，此项保留仅为兼容前置校验，始终无效）
  auto-update: false

# 是否禁用需要异域花园(ExoticGarden)物品的配方
disable-exotic-garden-recipes: false

# 是否禁用向动力科技(DynaTech)的培育仓添加美食家(Gastronomicon)的植物。
disable-dynatech-integration: true

# 制作完美食物的几率 (0-1)
perfect-food-max-chance: 0.25

# 训练厨师机器人所需的食物熟练度，以及计入玩家档案所需的食物熟练度
proficiency-threshold: 256

drops:
  # 相应方块掉落美食家(Gastronomicon)种子的几率 (0-1)
  block-break-chances:
    short-grass: 0.05 
    # 1.20.3及以上的服务器改这个修改草的掉率
    grass: 0.05
    # 1.20.3以下的服务器改这个修改草的掉率
    tall-grass: 0.1
    fern: 0.05
    large-fern: 0.1
    podzol: 0.03
    dirt: 0.01
    grass-block: 0.04
    rooted-dirt: 0.03
    mycelium: 0.05
    seagrass: 0.15

  # 击杀生物掉落美食家(Gastronomicon)物品的几率 (0-1)
  mob-kill-chances:
    squid: 0.35
    guardian: 0.35
    goat: 0.35
    salmon: 0.35


  # 禁用方块掉落与生物掉落的世界列表
  disabled-in: []


profile:
  # 玩家档案的头衔
  titles:
    0: 不是厨师
    1: 新手厨师
    50: 学徒厨师
    100: 经验丰富的厨师
    200: 三星大厨
